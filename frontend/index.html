<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeVerse — Adaptive, gamified programming education platform for beginners" />
    <title>CodeVerse — Adaptive Coding Platform</title>
    <!-- Prevent theme flashing (FOUC) before hydration -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('codeverse_theme') || 'system';
          var resolved = stored;
          if (stored === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-setting', stored);
          if (resolved === 'light') {
            document.documentElement.classList.add('theme-light');
          } else if (resolved === 'soft') {
            document.documentElement.classList.add('theme-soft');
          } else {
            document.documentElement.classList.add('theme-dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Modern typography specified in PRD Section 25 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
