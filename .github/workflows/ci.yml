name: CodeVerse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Initialize development environment
        run: npm run setup:env

      - name: Run Linters
        run: npm run lint

      - name: Run Build
        run: npm run build:frontend

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Run Campaign Integration Suite
        run: npm run test:campaign:integration
